[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "baker-enrichment"
version = "0.1.0"
description = "Resumable, provenance-aware Baker contact enrichment pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
baker-enrichment = "baker_enrichment.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["baker_enrichment"]
